services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-library_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library_network

  # ----------------------------------------------------------------------------
  # Python FastAPI AI Microservice (Face Recognition)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: library-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - FACE_SIMILARITY_THRESHOLD=${FACE_SIMILARITY_THRESHOLD:-0.65}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - library_network

  # ----------------------------------------------------------------------------
  # Spring Boot Backend (REST API, WebSocket, Auth Gateway)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-library_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long_123456}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8001}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - library_network

  # ----------------------------------------------------------------------------
  # Flutter Client (Web distribution served via Nginx)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: library-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - library_network

networks:
  library_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
