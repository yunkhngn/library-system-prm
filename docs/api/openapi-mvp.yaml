  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT purpose ACCESS; roles are checked by the backend.
    kioskAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT purpose KIOSK; cannot be replaced by a user token.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: login
      description: 'Log in with code or email. Access: 15 minutes; refresh: 7 days. Return mustChangePassword; tokens
        are restricted until the password changes. Invalid identifier/password returns the same error to avoid exposing
        account existence.'
      security: &id019 []
      x-roles: &id020
      - PUBLIC
      x-task: 3
      x-retry-policy: DO_NOT_AUTORETRY
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_JSON
        - INVALID_QUERY
        - UNKNOWN_FIELD
        '401':
        - INVALID_CREDENTIALS
        '403':
        - ACCOUNT_LOCKED
        '422':
        - VALIDATION_ERROR
        '429': &id021
        - RATE_LIMITED
        '500': &id022
        - INTERNAL_ERROR
      x-acceptance-tests:
      - Code/email both support login after normalization.
      - An incorrect password does not reveal whether the account exists.
      - LOCKED accounts receive no tokens.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: LIB001
              password: x
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
      - Auth
      summary: refreshTokens
      description: 'Single-use rotation: revoke the old token and issue a new pair within one transaction. Reusing
        a rotated token revokes the entire family. Do not automatically retry after a lost response; log in again.
        Business APIs are unavailable while mustChangePassword=true.'
      security: *id019
      x-roles: *id020
      x-task: 3
      x-retry-policy: DO_NOT_AUTORETRY
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_JSON
        - INVALID_QUERY
        - UNKNOWN_FIELD
        '401':
        - INVALID_REFRESH_TOKEN
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        '403':
        - ACCOUNT_LOCKED
        '429': *id021
        '500': *id022
      x-acceptance-tests:
      - 'Two concurrent refreshes: only one succeeds.'
      - Reuse revokes the family.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '429':
          $ref: '#/components/responses/Error429'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: example-token-not-a-real-credential
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: logout
      description: Revoke the family of the current user's refreshToken. Already-revoked tokens return 204. Another
        user's refresh token returns 404. Access tokens whose sid belongs to this family become invalid immediately.
        Allowed for tokens restricted by PASSWORD_CHANGE_REQUIRED.
      security: &id023
      - bearerAuth: []
      x-roles: &id024
      - STUDENT
      - LIBRARIAN
      - ADMIN
      x-task: 3
      x-retry-policy: IDEMPOTENT
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_JSON
        - INVALID_QUERY
        - UNKNOWN_FIELD
        '401':
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        '403':
        - FORBIDDEN
        - ACCOUNT_LOCKED
        - PASSWORD_CHANGE_REQUIRED
        - INVALID_TOKEN_PURPOSE
        '404':
        - RESOURCE_NOT_FOUND
        '429': *id021
        '500': *id022
      x-acceptance-tests:
      - Repeated logout returns 204.
      - An access token with a logged-out sid returns 401.
      responses:
        '204':
          description: Success, no response body
        '429':
          $ref: '#/components/responses/Error429'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '404':
          $ref: '#/components/responses/Error404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: example-token-not-a-real-credential
  /api/v1/me:
    get:
      operationId: getMyProfile
      tags:
      - Profile
      summary: getMyProfile
      description: Profile of the current JWT; no userId input. Allowed when mustChangePassword=true.
      security: *id023
      x-roles: *id024
      x-task: 3
      x-retry-policy: READ_SAFE
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_JSON
        - INVALID_QUERY
        - UNKNOWN_FIELD
        '401':
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        '403':
        - FORBIDDEN
        - ACCOUNT_LOCKED
        - PASSWORD_CHANGE_REQUIRED
        - INVALID_TOKEN_PURPOSE
        '429': *id021
        '500': *id022
      x-acceptance-tests:
      - Omit password_hash/authVersion.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '429':
          $ref: '#/components/responses/Error429'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/me/password:
    put:
      operationId: changeMyPassword
      tags:
      - Profile
      summary: changeMyPassword
      description: Check currentPassword. The new password must differ, contain 12–64 characters, and use ≤72 UTF-8
        bytes. Update the hash, increment auth_version, revoke all old families, clear mustChangePassword, then
        issue a new family/token pair. If the response is lost, log in with the new password; do not automatically
        retry.
      security: *id023
      x-roles: *id024
      x-task: 3
      x-retry-policy: DO_NOT_AUTORETRY
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_JSON
        - INVALID_QUERY
        - UNKNOWN_FIELD
        '401':
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        '403':
        - FORBIDDEN
        - ACCOUNT_LOCKED
        - PASSWORD_CHANGE_REQUIRED
        - INVALID_TOKEN_PURPOSE
        '422':
        - VALIDATION_ERROR
        - CURRENT_PASSWORD_INVALID
        - PASSWORD_UNCHANGED
        '429': *id021
        '500': *id022
      x-acceptance-tests:
      - Old passwords/refresh tokens/access tokens all become invalid.
      - Forced-change accounts must change the password via me/password before other business APIs become available.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: x
              newPassword: DevOnly!2026Change
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - Users
      summary: listUsers
      description: 'Search code, fullName, and email; default to all roles/statuses. q uses case-insensitive contains.
        Defaults: page=0,size=20.'
      security: &id025
      - bearerAuth: []
      x-roles: &id026
      - ADMIN
      x-task: 3
      x-retry-policy: READ_SAFE
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_JSON
        - INVALID_QUERY
        - UNKNOWN_FIELD
        '401':
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        '403':
        - FORBIDDEN
        - ACCOUNT_LOCKED
        - PASSWORD_CHANGE_REQUIRED
        - INVALID_TOKEN_PURPOSE
        '429': *id021
        '500': *id022
      x-acceptance-tests:
      - Student/Librarian receive 403.
      - Email is only exposed in account data authorized for Admin.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '429':
          $ref: '#/components/responses/Error429'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: ''
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        description: Trim; case-insensitive contains search on code/name, not an SQL expression.
        schema:
          type: string
          maxLength: 150
      - name: role
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - STUDENT
          - LIBRARIAN
          - ADMIN
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - ACTIVE
          - LOCKED
      - name: sort
        in: query
        required: false
        description: Only listed choices are accepted; never insert sort directly into SQL.
        schema:
          type: string
          enum:
          - createdAt,desc
          - code,asc
          - fullName,asc
          default: createdAt,desc
    post:
      operationId: createUser
      tags:
      - Users
      summary: createUser
      description: Code/email are UNIQUE after normalization; default status ACTIVE; mustChangePassword=true when
        omitted. Role is not inferred from code. Do not automatically retry; for CODE_EXISTS/EMAIL_EXISTS, compare
        the resource via list. Responses omit passwords.
      security: *id025
      x-roles: *id026
      x-task: 3
      x-retry-policy: DO_NOT_AUTORETRY
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_JSON
        - INVALID_QUERY
        - UNKNOWN_FIELD
        '401':
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        '403':
        - FORBIDDEN
        - ACCOUNT_LOCKED
        - PASSWORD_CHANGE_REQUIRED
        - INVALID_TOKEN_PURPOSE
        '409':
        - CODE_EXISTS
        - EMAIL_EXISTS
        '422':
        - VALIDATION_ERROR
        '429': *id021
        '500': *id022
      x-acceptance-tests:
      - SV001 and sv001 are treated as duplicates.
      - Email normalization cannot create duplicates.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              code: LIB001
              email: librarian@example.test
              fullName: Alex Nguyen
              role: STUDENT
              password: DevOnly!2026Change
