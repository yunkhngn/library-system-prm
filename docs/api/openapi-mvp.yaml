openapi: 3.0.3
info:
  title: Library Backend — MVP API contract
  version: 1.0.0-design
  description: 'Implementation contract; these APIs are not yet operational. Scope: STUDENT/LIBRARIAN/ADMIN/KIOSK
    with shared code/email. Detailed rules: api-mvp-ready-to-code.md. JSON camelCase, ISO8601 timestamps with timezone,
    page=0/size=20(max100).'
servers:
- url: http://localhost:8080
  description: Dev Docker host; designed endpoints are not yet implemented
tags:
- name: Access
- name: Analytics
- name: Auth
- name: Biometrics
- name: Configuration
- name: History
- name: Infrastructure
- name: Kiosks
- name: Occupancy
- name: Profile
- name: Shifts
- name: Student
- name: Users
- name: Visitors
components:
  schemas:
    AccessAnalytics:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        to:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        timezone:
          type: string
          enum:
          - Asia/Ho_Chi_Minh
        bucket:
          type: string
          enum:
          - DAY
          - HOUR
        totalCheckIns:
          type: integer
          format: int64
          minimum: 0
        totalCheckOuts:
          type: integer
          format: int64
          minimum: 0
        averageStaySeconds:
          type: number
          format: double
          minimum: 0
          nullable: true
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AccessBucket'
          minItems: 1
          maxItems: 10000
      required:
      - from
      - to
      - timezone
      - bucket
      - totalCheckIns
      - totalCheckOuts
      - averageStaySeconds
      - buckets
    AccessBucket:
      type: object
      additionalProperties: false
      properties:
        startsAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        checkIns:
          type: integer
          format: int64
          minimum: 0
        checkOuts:
          type: integer
          format: int64
          minimum: 0
        faceCheckIns:
          type: integer
          format: int64
          minimum: 0
        qrCheckIns:
          type: integer
          format: int64
          minimum: 0
        manualCheckIns:
          type: integer
          format: int64
          minimum: 0
      required:
      - startsAt
      - endsAt
      - checkIns
      - checkOuts
      - faceCheckIns
      - qrCheckIns
      - manualCheckIns
    AccessRequestStatus:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        idempotencyKey:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        status:
          type: string
          enum:
          - IN_PROGRESS
          - COMPLETED
        httpStatus:
          type: integer
          format: int64
          minimum: 100
          maximum: 599
          nullable: true
        result:
          type: object
          allOf:
          - $ref: '#/components/schemas/AccessResult'
          nullable: true
        error:
          type: object
          allOf:
          - $ref: '#/components/schemas/ApiError'
          nullable: true
        processingDeadline:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
      required:
      - requestId
      - idempotencyKey
      - status
      - httpStatus
      - result
      - error
      - processingDeadline
      - expiresAt
    AccessResult:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        sessionId:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        action:
          type: string
          enum:
          - CHECK_IN
          - CHECK_OUT
        subject:
          $ref: '#/components/schemas/Subject'
        method: &id001
          type: string
          enum:
          - FACE
          - QR
          - MANUAL
        occurredAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        occupancy:
          $ref: '#/components/schemas/Occupancy'
        simulated:
          type: boolean
          enum:
          - false
      required:
      - requestId
      - sessionId
      - action
      - subject
      - method
      - occurredAt
      - occupancy
      - simulated
    AccessSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        subject:
          $ref: '#/components/schemas/Subject'
        checkInTime:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        checkOutTime:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
          nullable: true
        checkInMethod: *id001
        checkOutMethod:
          type: string
          enum:
          - FACE
          - QR
          - MANUAL
          nullable: true
        checkInKiosk:
          type: object
          allOf:
          - $ref: '#/components/schemas/KioskSummary'
          nullable: true
        checkOutKiosk:
          type: object
          allOf:
          - $ref: '#/components/schemas/KioskSummary'
          nullable: true
        checkInBy:
          type: object
          allOf:
          - $ref: '#/components/schemas/Actor'
          nullable: true
        checkOutBy:
          type: object
          allOf:
          - $ref: '#/components/schemas/Actor'
          nullable: true
        checkoutReason:
          type: string
          enum:
          - USER_ACTION
          - MANUAL
          - CLOSING_TIME
          - MAX_DURATION
          nullable: true
        manualReason:
          type: string
          nullable: true
          maxLength: 1000
        checkOutManualReason:
          type: string
          nullable: true
          maxLength: 1000
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Until checkout for closed sessions, or snapshot time for open sessions.
      required:
      - id
      - subject
      - checkInTime
      - checkOutTime
      - checkInMethod
      - checkOutMethod
      - checkInKiosk
      - checkOutKiosk
      - checkInBy
      - checkOutBy
      - checkoutReason
      - manualReason
      - checkOutManualReason
      - durationSeconds
    AccessSessionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessSession'
        page:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    AccessStatus:
      type: object
      additionalProperties: false
      properties:
        isInside:
          type: boolean
        currentSession:
          type: object
          allOf:
          - $ref: '#/components/schemas/AccessSession'
          nullable: true
        asOf:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
      required:
      - isInside
      - currentSession
      - asOf
    StudentLookup:
      type: object
      additionalProperties: false
      description: Minimal student card for staff manual access (LIB-03). Omits email and biometric data.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: SV002
        fullName:
          type: string
          example: Trần Minh Quân
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
        isInside:
          type: boolean
        currentSessionId:
          type: string
          format: uuid
          nullable: true
        checkInTime:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - code
      - fullName
      - status
      - isInside
    Actor:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        code: &id002
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,31}$
          minLength: 3
          maxLength: 32
          example: LIB001
          description: Trim and uppercase before validation/storage; a shared code for all roles.
        fullName: &id003
          type: string
          minLength: 1
          maxLength: 150
          example: Alex Nguyen
          description: Trim; reject whitespace-only values.
      required:
      - id
      - code
      - fullName
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - ACCOUNT_LOCKED
          - AI_UNAVAILABLE
          - ALREADY_INSIDE
          - ASSIGNMENT_EXISTS
          - CAPACITY_REACHED
          - CHALLENGE_ALREADY_USED
          - CHALLENGE_EXPIRED
          - CHALLENGE_INVALID
          - CODE_EXISTS
          - CONSENT_POLICY_CHANGED
          - CONSENT_REQUIRED
          - CURRENT_PASSWORD_INVALID
          - DB_UNAVAILABLE
          - EMAIL_EXISTS
          - ENROLLMENT_CHANGED
          - FACE_NOT_FOUND
          - FORBIDDEN
          - IDEMPOTENCY_CONFLICT
          - IDEMPOTENCY_KEY_REQUIRED
          - IMAGE_INVALID
          - INCONSISTENT_FACES
          - INTERNAL_ERROR
          - INVALID_CREDENTIALS
          - INVALID_JSON
          - INVALID_QUERY
          - INVALID_REFRESH_TOKEN
          - INVALID_REQUEST
          - INVALID_TIME_RANGE
          - INVALID_TOKEN_PURPOSE
          - KIOSK_REACTIVATION_REQUIRES_ROTATION
          - KIOSK_REVOKED
          - LAST_ADMIN_PROTECTED
          - LIBRARY_CLOSED
          - LIVENESS_FAILED
          - LOW_QUALITY
          - MODEL_NOT_CALIBRATED
          - MODEL_NOT_READY
          - MODEL_VERSION_MISMATCH
          - MULTIPLE_FACES
          - NOT_INSIDE
          - NO_MATCH
          - PASSWORD_CHANGE_REQUIRED
          - PASSWORD_UNCHANGED
          - PAYLOAD_TOO_LARGE
          - QR_ALREADY_USED
          - QR_EXPIRED
          - QR_INVALID
          - RATE_LIMITED
          - REQUEST_ABORTED
          - REQUEST_IN_PROGRESS
          - RESOURCE_NOT_FOUND
          - SCAN_TOO_SOON
          - SHIFT_CANCELLED
          - SHIFT_OVERLAP
          - SIMULATED_RESULT_REJECTED
          - STAFF_NOT_ELIGIBLE
          - SUBJECT_NOT_ELIGIBLE
          - TOKEN_EXPIRED
          - TOKEN_REVOKED
          - UNAUTHENTICATED
          - UNKNOWN_FIELD
          - USER_HAS_OPEN_SESSION
          - VALIDATION_ERROR
          - VERSION_CONFLICT
          - VIDEO_INVALID
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        fallbackRecommended:
          type: boolean
          default: false
      required:
      - code
      - message
      - fieldErrors
      - traceId
      - timestamp
      - fallbackRecommended
    AssignStaffRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic lock; send the most recently read version.
        staffIds:
          type: array
          items:
            type: string
            format: uuid
            example: 14867700-9090-4000-8000-000000000001
          minItems: 1
          maxItems: 100
          uniqueItems: true
      required:
      - version
      - staffIds
    Assignment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        shiftId:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        staff:
          $ref: '#/components/schemas/Actor'
        startsAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic lock; send the most recently read version.
        assignedBy:
          $ref: '#/components/schemas/Actor'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
      required:
      - id
      - shiftId
      - staff
      - startsAt
      - endsAt
      - status
      - version
      - assignedBy
      - createdAt
      - updatedAt
    AssignmentBatch:
      type: object
      additionalProperties: false
      properties:
        shift:
          $ref: '#/components/schemas/Shift'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
      required:
      - shift
      - assignments
    AssignmentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        page:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    BackendHealth:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
      required:
      - status
    CancelShiftRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic lock; send the most recently read version.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - version
      - reason
    ChallengeInstruction:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - BLINK
          - TURN_LEFT
          - TURN_RIGHT
        order:
          type: integer
          format: int64
          minimum: 1
          maximum: 2
      required:
      - action
      - order
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 64
          format: password
          writeOnly: true
        newPassword: &id004
          type: string
          minLength: 12
          maxLength: 64
          format: password
          writeOnly: true
          description: 12–64 characters, with total UTF-8 length no greater than 72 bytes (BCrypt). Do not trim
            passwords.
          example: DevOnly!2026Change
      required:
      - currentPassword
      - newPassword
    ConfigChangedEvent:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        occurredAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        revision:
          type: integer
          format: int64
          minimum: 0
        count:
          type: integer
          format: int64
          minimum: 0
        maxCapacity:
          type: integer
          format: int64
          minimum: 1
        nearCapacity:
          type: boolean
        change:
          type: object
          additionalProperties: false
          properties:
            action:
              type: string
              enum:
              - CONFIG_CHANGED
          required:
          - action
      required:
      - eventId
      - occurredAt
      - revision
      - count
      - maxCapacity
      - nearCapacity
      - change
    ConsentRequest:
      type: object
      additionalProperties: false
      properties:
        policyVersion:
          type: string
          minLength: 1
          maxLength: 32
        accepted:
          type: boolean
          enum:
          - true
      required:
      - policyVersion
      - accepted
    CreateKioskRequest:
      type: object
      additionalProperties: false
      properties:
        code: *id002
        name: *id003
        mode:
          type: string
          enum:
          - ENTRY
          - EXIT
          - AUTO
      required:
      - code
      - name
      - mode
    CreateShiftRequest:
      type: object
      additionalProperties: false
      properties:
        name: *id003
        startsAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
      required:
      - name
      - startsAt
      - endsAt
    CreateUserRequest:
      type: object
      additionalProperties: false
      properties:
        code: *id002
        email: &id005
          type: string
          format: email
          maxLength: 254
          example: librarian@example.test
          description: Trim and lowercase the entire value before storage.
        fullName: *id003
        role: &id006
          type: string
          enum:
          - STUDENT
          - LIBRARIAN
          - ADMIN
        password: *id004
        mustChangePassword:
          type: boolean
          default: true
      required:
      - code
      - email
      - fullName
      - role
      - password
    CreateVisitorRequest:
      type: object
      additionalProperties: false
      properties:
        fullName: *id003
      required:
      - fullName
    EnrollmentUpload:
      type: object
      additionalProperties: false
      properties:
        images:
          type: array
          items:
            type: string
            format: binary
          minItems: 3
          maxItems: 5
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic lock; send the most recently read version.
      required:
      - images
      - version
    FaceAccessUpload:
      type: object
      additionalProperties: false
      properties:
        clip:
          type: string
          format: binary
        challengeId:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
      required:
      - clip
      - challengeId
    FaceCaptureRules:
      type: object
      additionalProperties: false
      properties:
        imageMimeTypes:
          type: array
          items:
            type: string
            enum:
            - image/jpeg
            - image/png
        minImages:
          type: integer
          format: int64
          enum:
          - 3
        maxImages:
          type: integer
          format: int64
          enum:
          - 5
        maxImageBytes:
          type: integer
          format: int64
          enum:
          - 5242880
        maxTotalImageBytes:
          type: integer
          format: int64
          enum:
          - 26214400
        maxImagePixels:
          type: integer
          format: int64
          enum:
          - 16000000
        clipMimeTypes:
          type: array
          items:
            type: string
            enum:
            - video/mp4
        maxClipBytes:
          type: integer
          format: int64
          enum:
          - 10485760
        minClipDurationSeconds:
          type: number
          format: double
          enum:
          - 1
        maxClipDurationSeconds:
          type: number
          format: double
          enum:
          - 3
        maxClipFps:
          type: integer
          format: int64
          enum:
          - 30
        maxClipWidth:
          type: integer
          format: int64
          enum:
          - 1280
        maxClipHeight:
          type: integer
          format: int64
          enum:
          - 720
      required:
      - imageMimeTypes
      - minImages
      - maxImages
      - maxImageBytes
      - maxTotalImageBytes
      - maxImagePixels
      - clipMimeTypes
      - maxClipBytes
      - minClipDurationSeconds
      - maxClipDurationSeconds
      - maxClipFps
      - maxClipWidth
      - maxClipHeight
    FaceChallenge:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeInstruction'
          minItems: 2
          maxItems: 2
        captureRules:
          $ref: '#/components/schemas/FaceCaptureRules'
      required:
      - challengeId
      - expiresAt
      - instructions
      - captureRules
    FaceConsent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 14867700-9090-4000-8000-000000000001
        policyVersion:
          type: string
        grantedAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        revokedAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic lock; send the most recently read version.
      required:
      - id
      - policyVersion
      - grantedAt
      - revokedAt
      - version
    FaceDeletion:
      type: object
      additionalProperties: false
      properties:
        isEnrolled:
          type: boolean
          enum:
          - false
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic lock; send the most recently read version.
        deletedAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
      required:
      - isEnrolled
      - version
      - deletedAt
    FaceEnrollment:
      type: object
      additionalProperties: false
      properties:
        isEnrolled:
          type: boolean
        consent:
          type: object
          allOf:
          - $ref: '#/components/schemas/FaceConsent'
          nullable: true
        imageCount:
          type: integer
          format: int64
          minimum: 0
          maximum: 5
        modelId:
          type: string
          nullable: true
        modelVersion:
          type: string
          nullable: true
        enrolledAt:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic lock; send the most recently read version.
      required:
      - isEnrolled
      - consent
      - imageCount
      - modelId
      - modelVersion
      - enrolledAt
      - version
    FacePolicy:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          example: '1.0'
        title:
          type: string
        content:
          type: string
        captureRules:
          $ref: '#/components/schemas/FaceCaptureRules'
      required:
      - version
      - title
      - content
      - captureRules
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    HeartbeatRequest:
      type: object
      additionalProperties: false
      properties:
        appVersion:
          type: string
          minLength: 1
          maxLength: 32
        cameraStatus:
          type: string
          enum:
          - OK
          - ERROR
          - UNAVAILABLE
      required:
      - appVersion
      - cameraStatus
    HeartbeatResult:
      type: object
      additionalProperties: false
      properties:
        serverTime:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00+07:00'
        heartbeatIntervalSeconds:
          type: integer
          format: int64
          example: 30
        kiosk:
