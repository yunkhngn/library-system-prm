x-realtime:
  protocol: STOMP 1.2 over native WebSocket, no SockJS
  url: ws://localhost:8080/ws
  connectHeaders:
    Authorization: Bearer <accessToken>
  heartbeat: 10000,10000
  subscribeDestination: /topic/occupancy
  roles:
  - LIBRARIAN
  - ADMIN
  eventSchema:
    $ref: '#/components/schemas/RealtimeEvent'
  ordering: Ignore event revision <= last seen; server sends after commit.
  reconnect: SUBSCRIBE, then GET /api/v1/occupancy + /api/v1/occupancy/people; refetch when an event is newer than
    the snapshot; delivery during disconnection is not guaranteed.
  expiry: The server closes connections on token expiry/revocation or account role/status changes; clients refresh
    and CONNECT again.
  sendPolicy: Client SEND to app/broker destinations is blocked; this endpoint only pushes server→client.
