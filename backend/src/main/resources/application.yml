server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: checkin-backend
  profiles:
    default: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_secure_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ------------------------------------------------------------------------------
# Application Custom Properties
# ------------------------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_at_least_32_characters_long_123456}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  library:
    max-capacity: 250
