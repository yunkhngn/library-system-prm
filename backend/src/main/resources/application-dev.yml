# Dev profile configuration
server:
  port: ${SERVER_PORT:8080}

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha

app:
  dev-mode: true
  ai-mock-mode: ${AI_MOCK_MODE:true}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
